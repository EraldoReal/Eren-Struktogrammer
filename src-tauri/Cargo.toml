[package]
name = "hus-struktogrammer-modern"
version = "1.2.1"
description = "Moderner, plattformübergreifender Nachbau des HuS Struktogrammers (DIN 66261)"
authors = ["HuS Struktogrammer"]
edition = "2021"

[lib]
name = "struktogrammer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
